services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: lifesqr_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: P@zzword1
      POSTGRES_DB: my_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lifesqr_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d my_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ASP.NET Application
  web:
    build: .
    container_name: lifesqr_web
    restart: always
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_HOST=postgres
      - DB_DATABASE=my_database
      - DB_USER=admin
      - DB_PASSWORD=P@zzword1
      - DB_PORT=5432
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lifesqr_network

volumes:
  postgres_data:

networks:
  lifesqr_network:
    driver: bridge
